<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CrossFit Root WOD 플래너</title>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--ink:#1d2330;--sub:#5d6575;--line:#e2e5eb;
  --brand:#e4572e;--brand-ink:#fff;--brand-soft:#fdece6;
  --ok:#2f9e6b;--ok-soft:#e5f5ed;--warn:#c9480b;--warn-soft:#fff1e6;
  --chip:#eef0f4;--focus:#2b6cdf;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
header{position:sticky;top:0;z-index:10;background:#1d2330;color:#fff;display:flex;align-items:center;gap:24px;padding:0 20px;height:52px}
header h1{font-size:17px;margin:0;letter-spacing:-.3px}
header h1 span{color:var(--brand)}
nav{display:flex;gap:4px}
nav button{background:none;border:0;color:#b9c0cc;font:inherit;font-size:15px;padding:14px 16px;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:#fff;border-bottom-color:var(--brand);font-weight:700}
main{max-width:1440px;margin:0 auto;padding:16px 20px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 small{font-weight:400;color:var(--sub);font-size:12px}
.hint{color:var(--sub);font-size:12px;margin:6px 0 0}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 11px;color:var(--ink)}
.btn:hover{border-color:#c3c8d2}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:700}
.btn.pri:hover{filter:brightness(.95)}
.btn.sm{padding:2px 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:none;color:var(--sub)}
.btn.ghost:hover{color:var(--ink);background:var(--chip)}
.btn.big{padding:9px 16px;font-size:15px}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:6px;padding:4px 7px;background:#fff;color:var(--ink);min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--focus);outline-offset:-1px;border-color:transparent}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grow{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid transparent;background:var(--chip);border-radius:999px;padding:3px 11px;font-size:13px;color:var(--ink)}
.chip:hover{border-color:#c3c8d2}
.chip .d{color:var(--sub);font-size:11px;margin-left:4px}
.chip.rec{background:var(--brand-soft);color:#a8341a;font-weight:600}
.chip.rec .d{color:#c25a3d}
.chip.on{outline:2px solid var(--brand);outline-offset:-2px}
.chip.dim{opacity:.55}
.chip.add::before{content:"+ ";color:var(--sub)}
.rec-row{display:grid;grid-template-columns:86px 1fr;gap:8px;align-items:start;margin-bottom:8px}
.rec-row>b{font-size:13px;padding-top:3px}

/* builder */
.build{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:16px;align-items:start}
.side{position:sticky;top:68px}
.line{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:10px;background:#fbfbfc}
.line-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.line-head .num{font-weight:800;color:var(--brand);min-width:28px}
.line-head .eq{font-size:12px;color:var(--sub)}
table.lv{width:100%;border-collapse:collapse}
table.lv th{font-size:11px;color:var(--sub);font-weight:400;text-align:left;padding:0 4px}
table.lv td{padding:2px 4px}
table.lv td:first-child{width:62px;font-size:12px;font-weight:700;white-space:nowrap}
table.lv td.r{width:118px}
table.lv td.w{width:110px}
table.lv input{width:100%}
table.lv td.r .u{display:flex;gap:4px}
table.lv td.r input{width:64px}
table.lv td.r select{width:50px;padding:4px 2px}
tr.man td:first-child::after{content:" ✎";color:var(--sub);font-weight:400}
.wbox{border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:13px}
.wbox.warn{background:var(--warn-soft);color:#7a2c06;border:1px solid #f6c9a6}
.wbox.ok{background:var(--ok-soft);color:#1d6446;border:1px solid #b9e2cd}
.wbox b{display:block;margin-bottom:2px}
.wbox ul{margin:4px 0 0;padding-left:18px}
pre.out{white-space:pre-wrap;word-break:break-word;background:#fbfbfc;border:1px solid var(--line);border-radius:8px;padding:12px;margin:0 0 10px;max-height:calc(100vh - 330px);overflow:auto;font:13px/1.55 "Malgun Gothic",system-ui,sans-serif}
.status{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--sub)}
.status.saved{background:var(--ok-soft);color:var(--ok)}
.status.dirty{background:var(--warn-soft);color:var(--warn)}
.mini-line{display:flex;gap:6px;margin-top:6px;align-items:center}
.mini-line .r{width:72px}
.mini-line .w{width:90px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:#fff;padding:4px 12px}
.seg button.on{background:var(--ink);color:#fff}

/* calendar */
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calgrid .wd{text-align:center;font-size:12px;color:var(--sub);padding:4px 0}
.day{min-height:84px;border:1px solid var(--line);border-radius:7px;background:#fff;text-align:left;padding:5px 6px;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.day:hover{border-color:#b8bec9}
.day.out{opacity:.35}
.day.sel{outline:2px solid var(--brand);outline-offset:-1px}
.day .dn{font-size:12px;font-weight:700}
.day.today .dn{background:var(--ink);color:#fff;border-radius:999px;padding:0 6px}
.day .fmt{font-size:11px;background:var(--brand-soft);color:#a8341a;border-radius:4px;padding:0 5px;font-weight:700}
.day .pt{font-size:11px;color:var(--sub);line-height:1.3}
.day .lg{font-size:11px;color:var(--ok)}
.cal-layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left}
table.t th{font-size:12px;color:var(--sub);font-weight:400}
.slotrow{border-top:1px solid var(--line);padding:8px 0;display:flex;flex-direction:column;gap:6px}
.slotrow:first-of-type{border-top:0}
.slothead{display:flex;align-items:center;gap:10px}
.slothead .cnt{font-size:12px;background:var(--ok-soft);color:var(--ok);border-radius:999px;padding:0 8px;font-weight:700}
.slothead .cin{width:64px;margin-left:4px}
.chip .x{border:0;background:none;color:var(--sub);padding:0 0 0 6px;font-size:11px}
.chip .x:hover{color:var(--warn)}
.nameform{display:flex;gap:6px}
.nameform input{width:140px}

/* settings */
.set-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.set-grid label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--sub)}
.tablewrap{overflow:auto;max-height:60vh;border:1px solid var(--line);border-radius:8px}
table.ed{border-collapse:collapse;font-size:12px;min-width:100%}
table.ed th{position:sticky;top:0;background:#f0f2f5;font-weight:600;padding:5px 4px;text-align:left;white-space:nowrap;z-index:1}
table.ed td{padding:2px 3px;border-top:1px solid var(--line)}
table.ed input,table.ed select{padding:3px 5px;font-size:12px}
table.ed .n{width:200px}.ed .s{width:60px}.ed .m{width:92px}.ed .l{width:170px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1d2330;color:#fff;padding:9px 18px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
#toast.show{opacity:1}
.mode{font-size:12px;color:#b9c0cc}
.mode.warn{color:#ffb38a}
.modal{position:fixed;inset:0;background:rgba(20,24,33,.45);display:flex;align-items:center;justify-content:center;z-index:40}
.modal .card{width:340px;margin:0}
[hidden]{display:none!important}
header h1,nav button,#authBtn,.mode{white-space:nowrap}
@media (max-width:1100px){.build,.cal-layout{grid-template-columns:1fr}.side{position:static}}
@media (max-width:700px){
  header{gap:8px;padding:0 10px}
  header h1{font-size:14px}
  nav button{padding:14px 8px}
  .mode{display:none}
  main{padding:10px 8px 40px}
  .day{min-height:64px;padding:3px 4px}
  .day .pt{display:none}
  .nameform input{flex:1;width:auto}
}
</style>
</head>
<body>
<header>
  <h1><span id="boxName">CrossFit Root</span> · WOD 플래너</h1>
  <nav>
    <button data-tab="build" class="on">만들기</button>
    <button data-tab="cal">달력</button>
    <button data-tab="set">설정</button>
  </nav>
  <span class="grow"></span>
  <span id="modeBadge" class="mode"></span>
  <button id="authBtn" class="btn sm" hidden></button>
</header>
<div id="loginModal" class="modal" hidden>
  <form class="card" id="loginForm">
    <h3>코치 로그인</h3>
    <p class="hint" style="margin:0 0 8px">로그인하면 WOD 작성·설정 변경을 할 수 있습니다. 이 PC에 로그인이 유지됩니다.</p>
    <input type="password" id="loginPw" placeholder="코치 비밀번호" autocomplete="current-password" style="width:100%">
    <div class="row" style="margin-top:10px;justify-content:flex-end">
      <button type="button" class="btn" id="loginCancel">취소</button>
      <button type="submit" class="btn pri">로그인</button>
    </div>
  </form>
</div>
<main>
  <section id="tab-build"></section>
  <section id="tab-cal" hidden></section>
  <section id="tab-set" hidden></section>
</main>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<div id="toast"></div>

function defaultData(){
  return {
    version:1,
    movements: SEED_MOVES.map((r,i)=>({id:'m'+(i+1),name:r[0],pattern:r[1],eq:r[2]?r[2].split(','):[],unit:r[3],reps:r[4],w:r[5],
      int:{name:r[6][0],f:r[6][1],w:r[6][2]}, beg:{name:r[7][0],f:r[7][1],w:r[7][2]}})),
    equipment: SEED_EQUIP.map(r=>({name:r[0],qty:r[1],personal:r[2]})),
    stretches: SEED_STRETCH.map(r=>({name:r[0],time:r[1],pats:r[2].split(',')})),
    settings:{boxName:'CrossFit Root',maxPeople:15,period:7,slots:['06:30','17:30','18:40','19:50','21:00'],includeStretch:true,stretchCount:4,
      labelInt:'(A)',labelBeg:'(B)',fmtFactor:{'AMRAP':1,'EMOM':1,'For Time':1,'Rounds/Chipper':1,'Interval':1}},
    programs:{}, logs:{}
  };
}
function migrate(d){
  const def = defaultData();
  const out = {...def, ...d};
  out.settings = {...def.settings, ...(d.settings||{})};
  out.settings.fmtFactor = {...def.settings.fmtFactor, ...((d.settings||{}).fmtFactor||{})};
  out.programs = d.programs||{}; out.logs = d.logs||{};
  return out;
}
function load(){
  try{ const s = localStorage.getItem(KEY); if(s) return migrate(JSON.parse(s)); }catch(e){ console.error(e); }
  return defaultData();
}

/* ================= 저장 (브라우저 / 서버) =================
   Vercel 등 api/data 가 동작하는 곳에서는 서버에 저장(online), 그 외(GitHub Pages·파일)에서는 브라우저에 저장 */
const PW_KEY = 'wodPlanner.coachPw';
const MODE = {online:false, role:'coach', pw:'', storageMissing:false, serverEmpty:false, coachEnabled:false};
const isCoach = ()=>MODE.role==='coach';
const configOf = ()=>({version:DB.version, movements:DB.movements, equipment:DB.equipment, stretches:DB.stretches, settings:DB.settings});
const lsGet = k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet = (k,v)=>{ try{ v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v); }catch(e){} };
function saveLocal(){
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch(e){ toast('브라우저 저장 실패: '+e.message); }
}
async function api(action,body){
  let j = {};
  try{
    const r = await fetch('api/data?action='+action, {method:'POST',
      headers:{'Content-Type':'application/json','X-Coach-Password':MODE.pw||''}, body:JSON.stringify(body||{})});
    j = await r.json().catch(()=>({}));
    if(!r.ok || !j.ok) throw new Error(j.error || 'HTTP '+r.status);
  }catch(e){ toast('⚠ '+e.message); throw e; }
  return j;
}
// 설정·동작 목록 변경 (연속 입력은 모아서 저장)
function persist(){
  if(!MODE.online) return saveLocal();
  if(!isCoach()) return;
  clearTimeout(persist._t);
  persist._t = setTimeout(()=>api('config',{config:configOf()}).catch(()=>{}), 500);
}
async function syncProgram(date){
  if(!MODE.online) return saveLocal();
  await api('program',{date, program:DB.programs[date]||null});
}
async function syncAll(){
  if(!MODE.online) return saveLocal();
  await api('import',{config:configOf(), programs:DB.programs, logs:DB.logs});
}
function applyServer(j, logsOnly){
  if(logsOnly){ DB.logs = j.logs||{}; return; }
  DB = j.config ? migrate({...j.config, programs:j.programs||{}, logs:j.logs||{}}) : {...defaultData(), programs:j.programs||{}, logs:j.logs||{}};
  MODE.serverEmpty = !j.config;
  MODE.coachEnabled = !!j.coachEnabled;
}
async function fetchServer(){
  const r = await fetch('api/data',{cache:'no-store'});
  const j = await r.json();
  return {r,j};
}
async function connect(){
  try{
    const {r,j} = await fetchServer();
    if(r.ok && j.ok){
      MODE.online = true; MODE.role = 'viewer';
      applyServer(j);
      const pw = lsGet(PW_KEY);
      if(pw) await login(pw,true);
    }else if(j && j.error==='storage-not-configured') MODE.storageMissing = true;
  }catch(e){ /* api 없음 → 브라우저 저장 모드 */ }
}
async function login(pw, silent){
  MODE.pw = pw;
  try{ await api('login'); }
  catch(e){ MODE.pw = ''; if(silent) lsSet(PW_KEY,null); return false; }
  MODE.role = 'coach'; lsSet(PW_KEY,pw);
  if(MODE.serverEmpty){
    // 서버가 비어 있으면 이 브라우저의 기존 데이터를 올릴지 묻는다
    let local = null;
    try{ local = JSON.parse(lsGet(KEY)||'null'); }catch(e){}
    const np = local ? Object.keys(local.programs||{}).length : 0, nl = local ? Object.keys(local.logs||{}).length : 0;
    if((np||nl) && confirm(`서버가 비어 있습니다. 이 브라우저에 저장된 데이터(프로그램 ${np}개 · 기록 ${nl}개)를 서버로 올릴까요?`)) DB = migrate(local);
    try{ await syncAll(); MODE.serverEmpty = false; }catch(e){}
  }
  return true;
}

  MODE.role = 'viewer'; MODE.pw = ''; lsSet(PW_KEY,null);

const movById = id=>DB.movements.find(m=>m.id===id);

/* ================= 스케일링 ================= */
function scaleReps(reps,f,unit){
  if(!isNum(reps) || f==null || f==='' || +f===1) return String(reps??'');
  let v = +reps * +f;
  if(unit==='ft') v = Math.round(v/5)*5;
  else if(unit==='m'){ const s = v>=200?50:10; v = Math.round(v/s)*s; }
  else v = Math.round(v);
  return String(Math.max(1,v));
}
function autoLevel(l,k){
  const m = l.movId ? movById(l.movId) : null;
  const s = m ? m[k] : {name:'', f:k==='int'?0.75:0.5, w:''};
  return {name:s.name||l.name, reps:scaleReps(l.reps,s.f,l.unit), w:s.w||'', manual:false};
}
function makeLine(m){
  const l = {movId:m.id,name:m.name,pattern:m.pattern,eq:[...m.eq],unit:m.unit,reps:String(m.reps??''),w:m.w||'',lv:{}};
  l.lv.int = autoLevel(l,'int'); l.lv.beg = autoLevel(l,'beg');
  return l;
}
const hasW = l=>!!(l.w || l.lv.int.w || l.lv.beg.w);

/* ================= 장비 대비책 ================= */
function pickSub(l){
  for(const k of ['int','beg']){
    const v = l.lv[k];
    if(v.name && v.name.trim().toLowerCase()!==l.name.trim().toLowerCase()){
      const r = repsTxt(v.reps,l.unit); return (r?r+' ':'')+v.name;
    }
  }
  return '';
}
function computeWarnings(p){
  const lines = p.wod.lines, n = lines.length;
  const out = {warn:[], unknown:[]};
  if(!n) return out;
  const max = +DB.settings.maxPeople || 15;
  const ff = +(DB.settings.fmtFactor[p.wod.format] ?? 1) || 1;
  const map = {};
  lines.forEach((l,i)=>(l.eq||[]).forEach(e=>{ e=e.trim(); if(e) (map[e]=map[e]||[]).push(i); }));
  for(const [name,idx] of Object.entries(map)){
    const eq = DB.equipment.find(x=>x.name===name);
    if(!eq || !(+eq.qty>0)){ out.unknown.push(name); continue; }
    const share = eq.personal ? 1 : Math.min(1, idx.length/n*ff);
    const need = Math.ceil(max*share - 1e-9);
    if(need > +eq.qty){
      const l = lines[idx[0]], sub = pickSub(l);
      out.warn.push({eq:name, qty:+eq.qty, need, max, share, personal:!!eq.personal, line:l.name, sub,
        text:`※ 장비 안내: ${name} ${eq.qty}개 — 인원 많을 시 ${sub?`대체 동작(${sub})으로 진행`:'대체 동작으로 진행'}`});
    }
  }
  return out;
}

/* ================= 카페 텍스트 ================= */
function repsTxt(reps,unit){
  const r = String(reps??'').trim(); if(!r) return '';
  return isNum(r) && unit && unit!=='회' ? r+unit : r;
}
function lineText(prefix,reps,unit,name,w,showW){
  const r = repsTxt(reps,unit);
  return `${prefix}${r?r+' ':''}${name}${showW?' '+(w||'-/-'):''}`;
}
function buildText(p){
  const S = DB.settings, blocks = []; let no = 1;
  const c = p.core;
  if(c.lines.length){
    const a = [`${no++}. ${c.type}`]; if(c.header.trim()) a.push(c.header.trim());
    c.lines.forEach(l=>a.push(lineText('',l.reps,l.unit,l.name,l.w,!!l.w)));
    blocks.push(a.join('\n'));
  }
  const w = p.wod;
  if(w.lines.length){
    const pre = i=>w.format==='EMOM' ? `M${i+1} - ` : '';
    const rx = [`${no++}. Wod`]; if(w.header.trim()) rx.push(w.header.trim());
    w.lines.forEach((l,i)=>rx.push(lineText(pre(i),l.reps,l.unit,l.name,l.w,hasW(l))));
    blocks.push(rx.join('\n'));
    [['int',S.labelInt],['beg',S.labelBeg]].forEach(([k,lab])=>{
      blocks.push([lab,...w.lines.map((l,i)=>lineText(pre(i),l.lv[k].reps,l.unit,l.lv[k].name,l.lv[k].w,hasW(l)))].join('\n'));
    });
    const wr = computeWarnings(p).warn;
    if(wr.length) blocks.push(wr.map(x=>x.text).join('\n'));
  }
  const st = p.stretch.lines.filter(s=>s.trim());
  if(S.includeStretch && st.length) blocks.push([`${no++}. Stretch`,...st].join('\n'));
  return blocks.join('\n\n');
}

/* ================= 추천 ================= */
function programPatterns(p){
  return [...new Set([...(p.wod?.lines||[]),...(p.core?.lines||[])].map(l=>l.pattern).filter(Boolean))];
}
function historyBefore(date){
  const pat={}, fmt={}, mov={};
  for(const [d,p] of Object.entries(DB.programs)){
    if(d>=date) continue;
    programPatterns(p).forEach(x=>{ if(!pat[x]||pat[x]<d) pat[x]=d; });
    const f = p.wod?.format;
    if(f && p.wod.lines.length && (!fmt[f]||fmt[f]<d)) fmt[f]=d;
    [...(p.wod?.lines||[]),...(p.core?.lines||[])].forEach(l=>{ if(l.movId && (!mov[l.movId]||mov[l.movId]<d)) mov[l.movId]=d; });
  }
  return {pat,fmt,mov};
}
function rank(keys,last,date){
  const period = +DB.settings.period || 7;
  return keys.map(k=>{ const d=last[k]; const ago = d?daysBetween(d,date):null; return {k,d,ago,rec:ago===null||ago>period}; })
    .sort((a,b)=>(b.ago===null?1e9:b.ago)-(a.ago===null?1e9:a.ago));
}
function complementPatterns(p){
  const wp = p.wod.lines.map(l=>l.pattern);
  const lo = wp.filter(x=>LOWER.includes(x)).length, up = wp.filter(x=>UPPER.includes(x)).length;
  let target;
  if(!wp.length) target = ['코어',...UPPER,...LOWER];
  else if(lo>up) target = ['코어',...UPPER];
  else if(up>lo) target = ['코어',...LOWER];
  else target = ['코어'];
  target = target.filter(x=>!wp.includes(x));
  if(!target.length) target = PATTERNS.filter(x=>!wp.includes(x) && x!=='유산소');
  return target;
}
function coreCandidates(p){
  const target = complementPatterns(p);
  const used = new Set(p.core.lines.map(l=>l.movId));
  let list;
  if(p.core.type==='Strength'){
    let pats = target.filter(x=>x!=='코어');
    if(!pats.length) pats = PATTERNS.filter(x=>!p.wod.lines.some(l=>l.pattern===x) && x!=='유산소' && x!=='코어');
    list = DB.movements.filter(m=>pats.includes(m.pattern) && m.eq.some(e=>STRENGTH_EQ.includes(e)));
  }else{
    list = DB.movements.filter(m=>target.includes(m.pattern) && m.pattern!=='유산소')
      .sort((a,b)=>(a.pattern==='코어'?0:1)-(b.pattern==='코어'?0:1));
  }
  return {target, list:list.filter(m=>!used.has(m.id))};
}
function suggestStretch(p){
  const S = DB.settings, count = +S.stretchCount||4;
  const freq = {};
  [...p.wod.lines,...p.core.lines].forEach(l=>{ if(l.pattern) freq[l.pattern]=(freq[l.pattern]||0)+1; });
  const pats = Object.keys(freq).sort((a,b)=>freq[b]-freq[a]);
  const chosen = [];
  let progress = true;
  while(chosen.length<count && progress){
    progress = false;
    for(const pt of pats){
      if(chosen.length>=count) break;
      const s = DB.stretches.find(s=>s.pats.includes(pt) && !chosen.includes(s));
      if(s){ chosen.push(s); progress = true; }
    }
  }
  return chosen.map(s=>`${s.time} ${s.name}`.trim());
}

  const num = w.format==='EMOM' ? `M${i+1}` : `${i+1}`;
  const unitSel = path=>`<select data-bind="${path}">${UNITS.map(u=>`<option ${u===l.unit?'selected':''}>${u}</option>`).join('')}</select>`;
  const lvRow = (k,lab)=>`<tr class="${l.lv[k].manual?'man':''}"><td>${lab}</td>
    <td class="r"><input data-bind="wod.lines.${i}.lv.${k}.reps" value="${esc(l.lv[k].reps)}"></td>
    <td><input data-bind="wod.lines.${i}.lv.${k}.name" value="${esc(l.lv[k].name)}"></td>
    <td class="w"><input data-bind="wod.lines.${i}.lv.${k}.w" value="${esc(l.lv[k].w)}" placeholder="-/-"></td></tr>`;
  return `<div class="line">
    <div class="line-head">
      <span class="num">${num}</span>
      <select data-bind="wod.lines.${i}.pattern">${PATTERNS.map(x=>`<option ${x===l.pattern?'selected':''}>${x}</option>`).join('')}</select>
      <span class="eq">${l.eq&&l.eq.length?'장비: '+esc(l.eq.join(', ')):'장비 없음'}</span>
      <span class="grow"></span>
      <button class="btn ghost sm" data-act="relevel" data-i="${i}" title="중급·초급을 동작 목록 기준으로 다시 채우기">↻ 스케일 다시</button>
      <button class="btn ghost sm" data-act="up" data-i="${i}">↑</button>
      <button class="btn ghost sm" data-act="down" data-i="${i}">↓</button>
      <button class="btn ghost sm" data-act="del" data-i="${i}">✕</button>
    </div>
    <table class="lv">
      <tr><th></th><th>횟수/거리</th><th>동작</th><th>무게 남/녀 lb</th></tr>
      <tr><td>RX</td><td class="r"><div class="u"><input data-bind="wod.lines.${i}.reps" value="${esc(l.reps)}">${unitSel(`wod.lines.${i}.unit`)}</div></td>
        <td><input data-bind="wod.lines.${i}.name" value="${esc(l.name)}" placeholder="동작 이름"></td>
        <td class="w"><input data-bind="wod.lines.${i}.w" value="${esc(l.w)}" placeholder="없음"></td></tr>

function renderCands(){
  const box = $('#cands'); if(!box) return;
  const h = historyBefore(draft.date), period = +DB.settings.period||7;
  const q = ui.search.trim().toLowerCase();
  let list = DB.movements;
  if(q) list = list.filter(m=>m.name.toLowerCase().includes(q));
  else if(ui.filterPats.size) list = list.filter(m=>ui.filterPats.has(m.pattern));
  const recent = id=>h.mov[id] && daysBetween(h.mov[id],draft.date)<=period;
  list = [...list].sort((a,b)=>(recent(a.id)?1:0)-(recent(b.id)?1:0));
  box.innerHTML = list.map(m=>`<button class="chip add ${recent(m.id)?'dim':''}" data-act="addMove" data-id="${m.id}" title="${esc(m.pattern)}${m.eq.length?' · '+esc(m.eq.join(',')):''}${h.mov[m.id]?' · 마지막 '+h.mov[m.id]:''}">${esc(m.name)}</button>`).join('')
    || '<span class="hint">해당 동작 없음 — 설정에서 추가할 수 있습니다</span>';
}

function refreshSide(){
  const wr = computeWarnings(draft), box = $('#warnBox');
  let html = '';
  if(!draft.wod.lines.length) html = '<div class="wbox ok">WOD 동작을 추가하면 장비 수량을 확인합니다.</div>';
  else if(wr.warn.length){
    html = wr.warn.map(x=>`<div class="wbox warn"><b>⚠ ${esc(x.eq)} 부족 — ${esc(x.line)}</b>
      최대 ${x.max}명 중 동시에 약 ${x.need}명 필요 ${x.personal?'(1인 1개 점유)':`(동시 사용 ${Math.round(x.share*100)}%)`} · 보유 ${x.qty}개
      <ul><li>카페 안내: ${esc(x.text.replace('※ 장비 안내: ',''))}</li></ul></div>`).join('');
  }else html = '<div class="wbox ok">✓ 장비 수량 충분</div>';
  if(wr.unknown.length) html += `<p class="hint">수량 미입력 장비(체크 안 함): ${esc(wr.unknown.join(', '))} — 설정에서 입력</p>`;
  box.innerHTML = html;
  $('#textOut').textContent = buildText(draft) || '(동작을 추가하면 여기에 카페 글이 만들어집니다)';
  const st = document.querySelector('#tab-build .status');
  if(st) st.outerHTML = statusHtml();
}

function setInput(path,v){
  const el = document.querySelector(`#tab-build [data-bind="${path}"]`);
  if(el && el!==document.activeElement) el.value = v;
}
function onBind(path,val){
  setPath(draft,path,val);
  let m;
  if((m = path.match(/^wod\.lines\.(\d+)\.(reps|name|unit)$/))){
    const i = +m[1], l = draft.wod.lines[i];
    for(const k of ['int','beg']) if(!l.lv[k].manual){
      const a = autoLevel(l,k); l.lv[k].reps = a.reps; l.lv[k].name = a.name;
      setInput(`wod.lines.${i}.lv.${k}.reps`,a.reps); setInput(`wod.lines.${i}.lv.${k}.name`,a.name);
    }
  }else if((m = path.match(/^wod\.lines\.(\d+)\.lv\.(int|beg)\.(reps|name)$/))){
    draft.wod.lines[+m[1]].lv[m[2]].manual = true;
  }else if(/^wod\.(format|minutes|rounds)$/.test(path)){
    if(draft.wod.headerAuto){ draft.wod.header = autoHeader(draft.wod); setInput('wod.header',draft.wod.header); }
  }else if(path==='wod.header'){
    draft.wod.headerAuto = false;
  }else if(path.startsWith('stretch.lines')){
    draft.stretch.manual = true;
  }
  refreshSide();
}

async function saveProgram(){
  const p = draft;
  if(!p.wod.lines.length && !p.core.lines.length){ toast('저장할 동작이 없습니다'); return; }
  const out = clone(p);
  out.patterns = programPatterns(out);
  out.warnings = computeWarnings(out).warn.map(x=>x.text);
  out.text = buildText(out);
  out.savedAt = new Date().toISOString();
  const prev = DB.programs[p.date];
  DB.programs[p.date] = out;
  try{ await syncProgram(p.date); }
  catch(e){ if(prev) DB.programs[p.date] = prev; else delete DB.programs[p.date]; return; }
  draft = clone(out); savedSnap = JSON.stringify(draft);
  refreshSide();
  toast(`${fmtDate(p.date)} 프로그램 저장됨 — 달력에 반영`);
}

function bindBuilder(){
  const root = $('#tab-build');
  root.addEventListener('input',e=>{
    const el = e.target;
    if(el.id==='mvSearch'){ ui.search = el.value; renderCands(); return; }
    if(el.dataset.bind && el.tagName!=='SELECT') onBind(el.dataset.bind, el.value);
  });
  root.addEventListener('change',e=>{
    const el = e.target;
    if(el.id==='bDate'){
      if(!el.value) return;
      if(isDirty() && !confirm('저장하지 않은 변경이 있습니다. 다른 날짜로 이동할까요?')){ el.value = draft.date; return; }
      loadDate(el.value); renderBuilder(); return;
    }
    if(el.dataset.bind && el.tagName==='SELECT'){
      const b = el.dataset.bind;
      onBind(b, el.value);
      if(b==='wod.format'){ fillFormatDefaults(); }
      if(/pattern$|format$/.test(b)) structural();
    }
  });
  root.addEventListener('click',async e=>{
    const b = e.target.closest('[data-act]'); if(!b) return;
    const act = b.dataset.act, i = +b.dataset.i, L = draft.wod.lines;
    switch(act){
      case 'togglePat': { const k=b.dataset.k; ui.filterPats.has(k)?ui.filterPats.delete(k):ui.filterPats.add(k); ui.search=''; renderBuilder(); break; }
      case 'setFormat': draft.wod.format = b.dataset.k; fillFormatDefaults(); renderBuilder(); break;
      case 'hdrAuto': draft.wod.headerAuto = true; draft.wod.header = autoHeader(draft.wod); setInput('wod.header',draft.wod.header); refreshSide(); break;
      case 'addMove': L.push(makeLine(movById(b.dataset.id))); structural(); break;
      case 'addCustom': {
        const pt = [...ui.filterPats][0] || '코어';
        L.push({movId:null,name:'',pattern:pt,eq:[],unit:'회',reps:'',w:'',lv:{int:{name:'',reps:'',w:'',manual:false},beg:{name:'',reps:'',w:'',manual:false}}});
        structural(); break;
      }
      case 'del': L.splice(i,1); structural(); break;
      case 'up': if(i>0){ [L[i-1],L[i]]=[L[i],L[i-1]]; renderBuilder(); } break;
      case 'down': if(i<L.length-1){ [L[i+1],L[i]]=[L[i],L[i+1]]; renderBuilder(); } break;
      case 'relevel': { const l=L[i]; l.lv.int=autoLevel(l,'int'); l.lv.beg=autoLevel(l,'beg'); renderBuilder(); break; }
      case 'coreType': {
        const t = b.dataset.k; if(draft.core.type===t) break;
        draft.core.type = t;
        if(t==='Strength' && draft.core.header==='3 Sets (not for time) 12:00') draft.core.header = '5 Sets (rest 2:00)';
        if(t==='Core' && draft.core.header==='5 Sets (rest 2:00)') draft.core.header = '3 Sets (not for time) 12:00';
        renderBuilder(); break;
      }
      case 'coreAdd': draft.core.lines.push(coreLine(movById(b.dataset.id))); structural(); break;
      case 'coreAuto': {
        const h = historyBefore(draft.date);
        const list = coreCandidates(draft).list.map(m=>({m,r:Math.random()}))
          .sort((a,b)=>(h.mov[a.m.id]||'').localeCompare(h.mov[b.m.id]||'') || a.r-b.r);
        list.slice(0,2).forEach(x=>draft.core.lines.push(coreLine(x.m)));
        structural(); break;
      }
      case 'coreAddCustom': draft.core.lines.push({movId:null,name:'',pattern:'코어',unit:'회',reps:'',w:''}); structural(); break;
      case 'coreDel': draft.core.lines.splice(i,1); structural(); break;
      case 'stAdd': draft.stretch.lines.push(b.dataset.t); draft.stretch.manual = true; renderBuilder(); break;
      case 'stAddBlank': draft.stretch.lines.push(''); draft.stretch.manual = true; renderBuilder(); break;
      case 'stDel': draft.stretch.lines.splice(i,1); draft.stretch.manual = true; renderBuilder(); break;
      case 'stAuto': draft.stretch.manual = false; structural(); break;
      case 'copy': { const ok = await copyText(buildText(draft)); toast(ok?'클립보드에 복사됨 — 카페에 붙여넣으세요':'복사 실패: 미리보기에서 직접 선택해 복사하세요'); break; }
      case 'save': saveProgram(); break;
      case 'tomorrow': {
        const t = addDays(todayStr(),1); if(draft.date===t) break;
        if(isDirty() && !confirm('저장하지 않은 변경이 있습니다. 이동할까요?')) break;
        loadDate(t); renderBuilder(); break;
      }
      case 'resetDraft':
        if(isDirty() && !confirm('작성 중인 내용을 비울까요? (저장된 프로그램은 그대로 남습니다)')) break;
        draft = newDraft(draft.date); savedSnap = DB.programs[draft.date] ? JSON.stringify(DB.programs[draft.date]) : null;
        renderBuilder(); break;
    }
  });
}
function fillFormatDefaults(){
  const d = FORMAT_DEFAULT[draft.wod.format];
  if(d){ draft.wod.minutes = String(d.m); draft.wod.rounds = String(d.r); }
  if(draft.wod.headerAuto) draft.wod.header = autoHeader(draft.wod);
}
function coreLine(m){ return {movId:m.id,name:m.name,pattern:m.pattern,unit:m.unit,reps:String(m.reps??''),w:''}; }

  for(let i=0;i<42;i++){ const d=new Date(start); d.setDate(start.getDate()+i); cells.push(ymd(d)); }

    const v = Object.values(DB.logs).map(l=>effCount(l,s)).filter(x=>x!=null);
    return {s, n:v.length, max:v.length?Math.max(...v):null, avg:v.length?(v.reduce((a,b)=>a+b,0)/v.length):null};

            <span class="dn">${+d.slice(8)}</span>
            ${p&&p.wod.lines.length?`<span class="fmt">${esc(p.wod.format)}</span>`:''}
            ${p?`<span class="pt">${esc((p.patterns||programPatterns(p)).join('·'))}</span>`:''}
            ${lg&&(tot||lg.memo)?`<span class="lg">👥 ${tot}명${lg.memo?' · 메모':''}</span>`:''}
          </button>`;}).join('')}
      </div>
    </div>

    <div>
      <div class="card">
        <h3>${fmtDate(sel)} <small>${sel}</small></h3>
        ${prog?`<pre class="out" style="max-height:340px">${esc(prog.text||buildText(prog))}</pre>
          <div class="row"><button class="btn" data-act="copyDay">📋 복사</button>${isCoach()?`<button class="btn" data-act="openDay">만들기에서 열기</button><span class="grow"></span><button class="btn ghost sm" data-act="delDay">프로그램 삭제</button>`:''}</div>`
        :`<p class="hint">저장된 프로그램이 없습니다.</p>${isCoach()?'<button class="btn" data-act="openDay">이 날짜로 만들기</button>':''}`}
      </div>
      <div class="card">

          const names = log.names?.[s] || [], n = effCount(log,s);

/* 타임별 참석 신청: 이름 목록, 이 브라우저에서 넣은 이름만 회원이 뺄 수 있음 */
const MINE_KEY = 'wodPlanner.mine', NAME_KEY = 'wodPlanner.myName';
const myName = ()=>lsGet(NAME_KEY) || '';
function mineSet(){ try{ return JSON.parse(lsGet(MINE_KEY)||'{}'); }catch(e){ return {}; } }
const mineKey = (d,s,n)=>`${d}|${s}|${n.toLowerCase()}`;
const isMine = (d,s,n)=>!!mineSet()[mineKey(d,s,n)];
function markMine(d,s,n,on){ const m = mineSet(); if(on) m[mineKey(d,s,n)] = 1; else delete m[mineKey(d,s,n)]; lsSet(MINE_KEY,JSON.stringify(m)); }
// 코치가 직접 입력한 인원이 있으면 그 값, 없으면 신청한 이름 수
function effCount(log,s){
  const c = log?.counts?.[s];
  if(c!==''&&c!=null&&isFinite(+c)) return +c;
  const n = log?.names?.[s]?.length || 0;
  return n || null;
}
function setLog(d,log){ if(log) DB.logs[d] = log; else delete DB.logs[d]; }
async function signup(d,s,name,remove){
  if(MODE.online){
    setLog(d,(await api('signup',{date:d, slot:s, name, remove:!!remove})).log);
  }else{
    const log = DB.logs[d] || {counts:{},names:{},memo:''};
    const names = {...(log.names||{})};
    names[s] = (names[s]||[]).filter(x=>x.toLowerCase()!==name.toLowerCase());
    if(!remove) names[s].push(name);
    const empty = Object.values(log.counts||{}).every(v=>v==='') && Object.values(names).every(l=>!l.length) && !(log.memo||'').trim();
    setLog(d, empty ? null : {...log, names});
    saveLocal();
  }
  markMine(d,s,name,!remove);
}
function bindCal(){
  const root = $('#tab-cal');
  root.addEventListener('submit',async e=>{
    const f = e.target.closest('.nameform'); if(!f) return;
    e.preventDefault();
    const name = f.querySelector('input').value.replace(/\s+/g,' ').trim();
    if(!name || name.length>20){ toast('이름을 1~20자로 입력해 주세요'); return; }
    const s = f.dataset.s, log = DB.logs[ui.calSel];
    if((log?.names?.[s]||[]).some(x=>x.toLowerCase()===name.toLowerCase())){ toast(`${s} 타임에 이미 '${name}'이(가) 있습니다`); return; }
    try{ await signup(ui.calSel,s,name,false); }catch(err){ return; }
    if(!isCoach()) lsSet(NAME_KEY,name);
    renderCal(); toast(`${s} 타임 신청 완료 — ${name}`);
  });
  root.addEventListener('click',async e=>{
    const b = e.target.closest('[data-act]'); if(!b) return;
    const [y,m] = (ui.calMonth||todayStr().slice(0,7)).split('-').map(Number);
    switch(b.dataset.act){
      case 'mPrev': ui.calMonth = ymd(new Date(y,m-2,1)).slice(0,7); renderCal(); break;
      case 'mNext': ui.calMonth = ymd(new Date(y,m,1)).slice(0,7); renderCal(); break;
      case 'mToday': ui.calMonth = todayStr().slice(0,7); ui.calSel = todayStr(); renderCal(); break;
      case 'selDay': ui.calSel = b.dataset.d; if(b.dataset.d.slice(0,7)!==ui.calMonth) ui.calMonth = b.dataset.d.slice(0,7); renderCal(); break;
      case 'copyDay': { const p=DB.programs[ui.calSel]; const ok=await copyText(p.text||buildText(p)); toast(ok?'복사됨':'복사 실패'); break; }
      case 'openDay':
        if(draft.date!==ui.calSel && isDirty() && !confirm('만들기 화면에 저장하지 않은 변경이 있습니다. 이동할까요?')) break;
        loadDate(ui.calSel); showTab('build'); break;
      case 'delDay': {
        const d = ui.calSel, prev = DB.programs[d];
        if(!confirm(`${fmtDate(d)} 프로그램을 삭제할까요? (운동 기록은 남습니다)`)) break;
        delete DB.programs[d];
        try{ await syncProgram(d); }catch(err){ DB.programs[d] = prev; break; }
        if(draft.date===d) savedSnap = null;
        renderCal(); toast('삭제됨'); break;
      }
      case 'saveLog': {
        const d = ui.calSel, counts = {};
        root.querySelectorAll('.cin[data-slot]').forEach(el=>{ counts[el.dataset.slot] = el.value.trim(); });
        const memo = $('#logMemo').value;
        if(MODE.online){
          try{ setLog(d,(await api('log',{date:d, log:{counts,memo}})).log); }catch(err){ break; }
        }else{
          setLog(d,{counts, names:DB.logs[d]?.names||{}, memo}); saveLocal();
        }
        renderCal(); toast('인원·메모 저장됨'); break;
      }
      case 'rmName': {
        const s = b.dataset.s, n = b.dataset.n;
        if(!confirm(`${s} 타임에서 '${n}'을(를) 뺄까요?`)) break;
        try{ await signup(ui.calSel,s,n,true); }catch(err){ break; }
        renderCal(); toast('신청을 취소했습니다'); break;
      }
    }
  });
}

function bindSet(){
  const root = $('#tab-set');
  root.addEventListener('input',e=>{
    if(e.target.id==='setSearch'){ ui.setSearch = e.target.value; renderMvTable(); }
  });
  root.addEventListener('change',e=>{
    const el = e.target, S = DB.settings, d = el.dataset;
    if(el.id==='setPat'){ ui.setPat = el.value; renderMvTable(); return; }
    if(d.set){
      const k = d.set;
      if(k.startsWith('fmt:')) S.fmtFactor[k.slice(4)] = +el.value || 1;
      else if(k==='slots') S.slots = el.value.split(/[,\s]+/).map(s=>s.trim()).filter(Boolean);
      else if(k==='includeStretch') S.includeStretch = el.checked;
      else if(['maxPeople','period','stretchCount'].includes(k)) S[k] = Math.max(1, +el.value || 1);
      else S[k] = el.value;
      if(k==='boxName') applyBoxName();
    }else if(d.mv!=null){
      const m = DB.movements[+d.mv], f = d.f;
      if(f==='eq') m.eq = el.value.split(',').map(s=>s.trim()).filter(Boolean);
      else if(f==='int.f'||f==='beg.f') m[f.slice(0,3)].f = el.value===''?1:+el.value;
      else if(f.includes('.')) setPath(m,f,el.value);
      else m[f] = el.value;
    }else if(d.eqi!=null){
      const q = DB.equipment[+d.eqi];
      if(d.f==='personal') q.personal = el.checked;
      else if(d.f==='qty') q.qty = el.value===''?'':+el.value;
      else q.name = el.value.trim();
    }else if(d.st!=null){
      const s = DB.stretches[+d.st];
      if(d.f==='pats') s.pats = el.value.split(',').map(x=>x.trim()).filter(Boolean);
      else s[d.f] = el.value;
    }else return;
    persist(); toast('설정 저장됨');
  });
  root.addEventListener('click',e=>{
    const b = e.target.closest('[data-act]'); if(!b) return;
    const i = +b.dataset.i;
    switch(b.dataset.act){
      case 'addEq': DB.equipment.push({name:'새 장비',qty:'',personal:false}); persist(); renderSet(); break;
      case 'delEq': if(confirm(`'${DB.equipment[i].name}' 장비를 삭제할까요?`)){ DB.equipment.splice(i,1); persist(); renderSet(); } break;
      case 'addMv':
        DB.movements.unshift({id:'m'+Date.now(),name:'새 동작',pattern:ui.setPat||'코어',eq:[],unit:'회',reps:10,w:'',int:{name:'',f:1,w:''},beg:{name:'',f:0.75,w:''}});
        ui.setSearch = ''; persist(); renderSet(); break;
      case 'delMv': if(confirm(`'${DB.movements[i].name}' 동작을 삭제할까요? (이미 저장된 프로그램에는 영향 없음)`)){ DB.movements.splice(i,1); persist(); renderMvTable(); } break;
      case 'addSt': DB.stretches.push({name:'새 스트레치',time:'0:30',pats:[]}); persist(); renderSet(); break;
      case 'delSt': DB.stretches.splice(i,1); persist(); renderSet(); break;
      case 'export': exportBackup(); break;
      case 'import': $('#importFile').click(); break;
      case 'resetAll':
        if(!confirm('모든 데이터(프로그램·기록·설정)를 초기값으로 되돌릴까요? 먼저 백업을 내보내는 것을 권장합니다.')) break;
        if(!confirm('정말 초기화할까요? 되돌릴 수 없습니다.')) break;
        DB = defaultData();
        syncAll().then(()=>{ loadDate(addDays(todayStr(),1)); applyBoxName(); renderSet(); toast('초기화됨'); }).catch(()=>{});
        break;
    }
  });
  $('#importFile').addEventListener('change',e=>{
    const file = e.target.files[0]; e.target.value = '';
    if(!file) return;
    const rd = new FileReader();
    rd.onload = async ()=>{
      let d;
      try{
        d = JSON.parse(rd.result);
        if(!Array.isArray(d.movements) || typeof d.programs!=='object') throw new Error('WOD 플래너 백업 파일이 아닙니다');
      }catch(err){ alert('불러오기 실패: '+err.message); return; }
      if(!confirm(`백업을 불러오면 현재 데이터가 바뀝니다.\n(프로그램 ${Object.keys(d.programs).length}개 · 기록 ${Object.keys(d.logs||{}).length}개)\n계속할까요?`)) return;
      const prev = DB;
      DB = migrate(d);
      try{ await syncAll(); }catch(err){ DB = prev; return; }
      loadDate(draft.date); applyBoxName(); renderSet(); toast('백업 불러오기 완료');
    };
    rd.readAsText(file,'utf-8');
  });
}
function exportBackup(){
  const blob = new Blob([JSON.stringify(DB,null,1)],{type:'application/json'});
  const a = document.createElement('a');
  const slug = (DB.settings.boxName||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  a.href = URL.createObjectURL(blob); a.download = `${slug?slug+'-':''}wod-planner-backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('백업 파일을 내려받았습니다');
}

  ['build','cal','set'].forEach(x=>$('#tab-'+x).hidden = x!==t);
  if(t==='build') renderBuilder(); else if(t==='cal'){ renderCal(); refreshCal(); } else renderSet();
  window.scrollTo(0,0);
}
// 달력을 열 때 다른 사람이 입력한 최신 인원·프로그램을 다시 받아온다
async function refreshCal(){
  if(!MODE.online) return;
  try{
    const {r,j} = await fetchServer();
    if(!r.ok || !j.ok) return;
    applyServer(j, isCoach());   // 코치는 편집 중인 설정을 지키기 위해 기록만 갱신
    if(ui.tab==='cal') renderCal();
  }catch(e){}
}
document.querySelector('nav').addEventListener('click',e=>{ const b=e.target.closest('[data-tab]'); if(b) showTab(b.dataset.tab); });
window.addEventListener('beforeunload',e=>{ if(draft && isDirty()){ e.preventDefault(); e.returnValue=''; } });
$('#authBtn').addEventListener('click',()=>{
  if(isCoach()) return logout();
  $('#loginModal').hidden = false; $('#loginPw').value = ''; $('#loginPw').focus();
});
$('#loginCancel').addEventListener('click',()=>{ $('#loginModal').hidden = true; });
$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const pw = $('#loginPw').value; if(!pw) return;
  if(!(await login(pw))) return;
  $('#loginModal').hidden = true;
  applyBoxName(); loadDate(addDays(todayStr(),1)); renderAuth(); showTab('build');
  toast('코치 모드로 로그인했습니다');
});
bindBuilder(); bindCal(); bindSet();
(async ()=>{
  await connect();
  applyBoxName(); renderAuth();
  loadDate(addDays(todayStr(),1));
  showTab(isCoach() ? 'build' : 'cal');
})();
</script>
</body>
</html>
